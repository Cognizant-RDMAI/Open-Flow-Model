[project]
name = "Open-Flow-Model"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = "~3.10"
dependencies = [
    "numpy (==1.23.5)",
    "pandas (==1.5.3)",
    "geopandas (==1.0.1)",
    "scikit-learn (==1.6.1)",
    "keras (==2.11.0)",
    "tensorflow (==2.11.0) ; platform_system != 'Darwin'",
    "tensorflow-macos (==2.11.0) ; platform_system == 'Darwin'",
    "tensorflow-metal (==0.7.1) ; platform_system == 'Darwin'",
    "mlflow (==2.21.3)",
    "missingno (==0.5.2)",
    "matplotlib (==3.10.0)",
    "matplotlib-venn (==1.1.2)",
    "seaborn (==0.13.2)",
    "contextily (==1.6.2)",
    "requests (==2.32.3)",
    "python-dotenv (==1.1.0)",
    "inequalipy (==1.0.5)",
    "tqdm (==4.67.1)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipykernel = "^6.30.1"
pytest = "^8.4.2"
pytest-mock = "^3.15.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
